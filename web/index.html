<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>绘本智能伴读 App</title>
  <link rel="stylesheet" href="fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="tailwindcss.js"></script>
</head>
<body class="min-h-screen flex justify-center bg-slate-900">
  <div class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col shadow-2xl overflow-hidden">
    <header class="bg-indigo-600 text-white px-5 pt-6 pb-5 rounded-b-3xl shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center backdrop-blur-sm">
            <i class="fa-solid fa-book-open-reader text-xl"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-wide">绘本智能伴读</h1>
            <p class="text-xs text-indigo-200">BLE 长连接 · 硬件配网 · 边下边播 · v2.0</p>
          </div>
        </div>
        <div id="sseBadge" class="flex items-center gap-1.5 bg-indigo-800/60 px-3 py-1 rounded-full text-xs font-medium border border-indigo-400/30">
          <span id="sseDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="sseStatusText">未连接</span>
        </div>
      </div>
      <div class="mt-4 bg-white/10 backdrop-blur-md rounded-2xl p-3.5 border border-white/15 flex items-center justify-between">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <i class="fa-brands fa-bluetooth-b text-indigo-200 text-lg"></i>
          <div class="truncate">
            <div class="text-[11px] text-indigo-200">当前绑定设备 ID</div>
            <div id="currentDeviceIdDisplay" class="text-sm font-mono font-semibold truncate">尚未绑定开发板</div>
          </div>
        </div>
        <span id="pageEpochBadge" class="text-xs bg-indigo-500/50 px-2.5 py-1 rounded-lg font-mono shrink-0">
          页次: #0
        </span>
      </div>
    </header>

    <main class="flex-1 p-4 space-y-4 overflow-y-auto">
      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-link text-indigo-600"></i> 第一步：连接开发板
          </h2>
          <span class="text-[11px] text-slate-400 font-mono">Prefix: PicBook</span>
        </div>
        <button id="buttonScanBle" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-semibold rounded-xl shadow-md flex items-center justify-center gap-2.5 transition">
          <i class="fa-brands fa-bluetooth text-lg"></i>
          <span>扫描或复用开发板连接</span>
        </button>
        <div class="pt-1">
          <div class="flex gap-2">
            <input id="manualDeviceIdInput" type="text" placeholder="手动输入设备 ID"
              class="flex-1 text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-mono bg-slate-50" />
            <button id="buttonSubscribeSse" class="px-4 py-2.5 bg-slate-800 text-white text-sm font-medium rounded-xl shrink-0">
              订阅 SSE
            </button>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-router text-indigo-600"></i> 硬件联网与换书
          </h2>
          <span class="text-[11px] text-slate-400 font-mono">Protocol v1.3</span>
        </div>
        <div class="flex gap-2">
          <input id="serverBaseUrlInput" type="url" placeholder="服务端地址"
            class="flex-1 text-xs px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-mono bg-slate-50" />
          <button id="buttonSaveServerUrl" class="px-3 py-2.5 bg-slate-800 text-white text-xs font-medium rounded-xl shrink-0">
            保存
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input id="wifiSsidInput" type="text" placeholder="Wi-Fi 名称"
            class="text-xs px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50" />
          <input id="wifiPasswordInput" type="password" placeholder="Wi-Fi 密码"
            class="text-xs px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-slate-50" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="buttonProvisionWifi" class="py-2.5 px-3 bg-indigo-600 text-white text-xs font-semibold rounded-xl">
            写入开发板 Wi-Fi
          </button>
          <button id="buttonSwitchBook" class="py-2.5 px-3 bg-emerald-600 text-white text-xs font-semibold rounded-xl">
            通知开发板换书
          </button>
        </div>
        <button id="buttonDisconnectBle" class="w-full py-2 px-3 border border-slate-200 text-slate-500 text-[11px] font-medium rounded-xl">
          断开蓝牙（之后可扫描另一块开发板）
        </button>
        <div class="flex items-center justify-between rounded-lg bg-indigo-50 px-3 py-2 text-[11px] text-indigo-700">
          <span>当前书本</span>
          <span id="currentBookIdDisplay" class="font-mono font-semibold">未识别</span>
        </div>
        <div id="bleCommandStatus" class="text-[11px] text-slate-500 bg-slate-50 rounded-lg px-3 py-2">
          等待硬件连接
        </div>
      </section>

      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-headphones-simple text-indigo-600"></i> 音频流状态
          </h2>
          <button id="buttonClearAudioCache" class="text-xs text-rose-600 font-medium flex items-center gap-1">
            <i class="fa-solid fa-trash-can"></i> 清空缓存
          </button>
        </div>
        <div class="bg-slate-900 text-white rounded-xl p-3.5 flex items-center gap-3.5">
          <div id="playingIconBox" class="w-11 h-11 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0">
            <i id="playingIcon" class="fa-solid fa-volume-off text-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-xs text-slate-400">当前播放状态</div>
            <div id="nowPlayingDetail" class="text-sm font-semibold truncate text-indigo-300">等待开发板翻页推送音频...</div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-[11px] text-slate-400">待下载队列</div>
            <div id="statDownloadQueue" class="text-base font-bold text-slate-700 font-mono">0</div>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-[11px] text-slate-400">待播放队列</div>
            <div id="statPlaybackQueue" class="text-base font-bold text-indigo-600 font-mono">0</div>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-[11px] text-slate-400">已播完销毁</div>
            <div id="statCleanedCount" class="text-base font-bold text-emerald-600 font-mono">0</div>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col h-64">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-terminal text-indigo-600"></i> 实时运行日志
          </h2>
          <button id="buttonClearLogs" class="text-xs text-slate-400">清空日志</button>
        </div>
        <div id="logContainer" class="flex-1 bg-slate-950 text-slate-200 font-mono text-xs p-3 rounded-xl overflow-y-auto log-scroll space-y-1.5 leading-relaxed"></div>
      </section>
    </main>

    <audio id="htmlAudioPlayer" preload="auto"></audio>
  </div>

  <script src="ble-bridge.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
